name: Daily PE check

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 18:00 IST, weekdays (after NSE close)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run one-time history backfill first"
        type: boolean
        default: false
      always_notify:
        description: "Send a Telegram message even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-pe
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - name: Backfill history
        if: ${{ inputs.backfill }}
        run: python -m tracker.run backfill --years 12

      - name: Daily check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tracker.run daily ${{ inputs.always_notify && '--always-notify' || '' }}

      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "pe-tracker-bot"
          git config user.email "pe-tracker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "data: update Nifty 50 PE" && git push)
